<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Most</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f1f3f8;
    --muted: #8b93a7;
    --accent: #7c5cff;
    --accent2: #22d3ee;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 600px at 10% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
      radial-gradient(800px 500px at 110% 110%, rgba(34, 211, 238, 0.18), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .hidden { display: none !important; }

  #start {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: min(400px, 100%);
    padding: 36px 28px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: center;
  }
  .logo {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
  }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 22px;
    border: 1px solid transparent;
    border-radius: 14px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.12s, filter 0.2s, background 0.2s;
    user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #5b8cff); box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: rgba(255, 255, 255, 0.05); border-color: var(--border); }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }

  .join-box { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .join-box.hidden { display: none; }
  input#codeInput {
    width: 100%;
    padding: 15px;
    font: inherit;
    font-size: 20px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 2px;
    text-align: center;
    color: var(--text);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input#codeInput:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.2); }
  input#codeInput::placeholder { color: #4b5263; letter-spacing: 1px; }

  .err { color: #fca5a5; min-height: 1.2em; font-size: 14px; margin: 0; }

  #room {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 110px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .brand { font-weight: 800; font-size: 22px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .code-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .code-pill:hover { background: rgba(255, 255, 255, 0.08); }
  .code-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .code-pill .hint { color: var(--muted); font-family: system-ui, sans-serif; font-size: 12px; }

  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    align-content: center;
  }
  .tile {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(145deg, #1a1e2a, #0e1118);
    border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
  }
  .tile video { width: 100%; height: 100%; object-fit: cover; background: #000; display: block; }
  .tile.self video { transform: scaleX(-1); }
  .tile .avatar {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  .tile.no-video .avatar { display: flex; }
  .tile.no-video video { opacity: 0; }
  .tag {
    position: absolute;
    left: 12px;
    bottom: 12px;
    padding: 6px 12px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    font-size: 13px;
  }
  .tile.self .tag::before { content: "Ты · "; color: var(--accent2); }

  .controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border-radius: 24px;
    background: rgba(18, 21, 30, 0.85);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .round {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.12s;
    padding: 0;
  }
  .round:hover { background: rgba(255, 255, 255, 0.14); }
  .round:active { transform: scale(0.92); }
  .round:disabled { opacity: 0.35; cursor: not-allowed; }
  .round.off { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  .round.leave { background: var(--danger); border-color: transparent; color: #fff; width: 66px; height: 66px; }
  .round.leave:hover { background: #dc2626; }
  .round svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translate(-50%, -20px);
    max-width: min(460px, calc(100% - 32px));
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(30, 20, 24, 0.95);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fecaca;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .logo { font-size: 38px; }
  }
</style>
</head>
<body>

<section id="start">
  <div class="card">
    <h1 class="logo">Most</h1>
    <p class="sub">Видеозвонки в один клик</p>
    <button id="createBtn" class="btn btn-primary">Создать комнату</button>
    <button id="joinBtn" class="btn btn-ghost">Подключиться</button>
    <div id="joinBox" class="join-box hidden">
      <input id="codeInput" placeholder="Most-xxxxx" maxlength="10" autocomplete="off" spellcheck="false">
      <button id="joinGo" class="btn btn-primary">Войти</button>
    </div>
    <p id="startErr" class="err"></p>
  </div>
</section>

<section id="room" class="hidden">
  <div class="topbar">
    <span class="brand">Most</span>
    <button id="roomCode" class="code-pill" title="Скопировать код">
      <span class="dot"></span>
      <span id="codeText"></span>
      <span class="hint" id="copyHint">копировать</span>
    </button>
  </div>
  <div id="grid"></div>
</section>

<nav id="controls" class="controls hidden">
  <button id="micBtn" class="round" title="Микрофон">
    <svg id="micOn" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
    <svg id="micOff" class="hidden" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M19 11a7 7 0 0 1-.8 3.2M5 11a7 7 0 0 0 10.7 5.9M12 18v3"/></svg>
  </button>
  <button id="camBtn" class="round" title="Камера">
    <svg id="camOn" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
    <svg id="camOff" class="hidden" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M16 10l6-3v10l-6-3M2 8v8a2 2 0 0 0 2 2h9"/><path d="M14.5 6H4"/></svg>
  </button>
  <button id="leaveBtn" class="round leave" title="Выйти">
    <svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
  </button>
</nav>

<div id="toast"></div>

<script>
const API = '/api/signal';
const ICE = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
  ],
};
const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const CODE_RE = /^Most-[A-Z2-9]{5}$/;
const $ = id => document.getElementById(id);

let myId = null;
let roomCode = null;
let isHost = false;
let roomShown = false;
let polling = false;
let localStream = null;
let joinTimer = null;
let toastTimer = null;
const pcs = new Map();
const pending = new Map();
const members = new Set();

function randomCode() {
  let s = 'Most-';
  for (const b of crypto.getRandomValues(new Uint8Array(5))) s += CHARS[b % CHARS.length];
  return s;
}

function randomId() {
  return 'p-' + crypto.randomUUID().slice(0, 8);
}

function setErr(text) { $('startErr').textContent = text; }

function toast(text, ms = 5000) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

function explainMediaError(e) {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    return 'Камера и микрофон работают только по https. Открой сайт через https-ссылку.';
  }
  if (e?.name === 'NotAllowedError' || e?.name === 'SecurityError') {
    return 'Доступ к камере и микрофону запрещён. Разреши его в настройках браузера и попробуй снова.';
  }
  if (e?.name === 'NotFoundError') return 'Камера или микрофон не найдены.';
  if (e?.name === 'NotReadableError') return 'Камера или микрофон заняты другим приложением.';
  return 'Не удалось получить камеру и микрофон.';
}

async function getMedia() {
  localStream = null;
  let lastErr = null;
  if (navigator.mediaDevices?.getUserMedia) {
    const attempts = [
      { audio: true, video: true },
      { audio: true, video: false },
      { audio: false, video: true },
    ];
    for (const c of attempts) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia(c);
        break;
      } catch (e) {
        lastErr = e;
      }
    }
  }
  if (!localStream) {
    localStream = new MediaStream();
    toast(explainMediaError(lastErr) + ' Комната будет без микрофона и видео.', 8000);
  }
  syncControls();
}

function syncControls() {
  const hasAudio = !!localStream?.getAudioTracks().length;
  const hasVideo = !!localStream?.getVideoTracks().length;
  $('micBtn').disabled = !hasAudio;
  $('camBtn').disabled = !hasVideo;
  setToggle('mic', hasAudio && localStream.getAudioTracks()[0].enabled);
  setToggle('cam', hasVideo && localStream.getVideoTracks()[0].enabled);
}

function setToggle(kind, on) {
  const btn = $(kind + 'Btn');
  btn.classList.toggle('off', !on);
  $(kind + 'On').classList.toggle('hidden', !on);
  $(kind + 'Off').classList.toggle('hidden', on);
  btn.title = (kind === 'mic' ? 'Микрофон' : 'Камера') + (on ? ': вкл' : ': выкл');
}

function addTile(id, stream, self = false) {
  if ($('tile-' + id)) return;
  const tile = document.createElement('div');
  tile.id = 'tile-' + id;
  tile.className = 'tile' + (self ? ' self' : '');
  const v = document.createElement('video');
  v.autoplay = true;
  v.playsInline = true;
  v.srcObject = stream;
  if (self) v.muted = true;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = self ? 'Я' : '?';
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = self ? 'Камера' : 'Участник';
  tile.append(v, avatar, tag);
  $('grid').appendChild(tile);
  const update = () => tile.classList.toggle('no-video', !v.srcObject?.getVideoTracks().length);
  update();
  stream.addEventListener?.('addtrack', update);
  stream.addEventListener?.('removetrack', update);
}

function removeTile(id) { $('tile-' + id)?.remove(); }

function showRoom() {
  roomShown = true;
  $('codeText').textContent = roomCode;
  $('copyHint').textContent = 'копировать';
  $('start').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('controls').classList.remove('hidden');
  addTile('self', localStream, true);
  syncControls();
}

async function send(to, type, data) {
  try {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: roomCode, from: myId, to, type, data }),
    });
  } catch {}
}

function startPolling() {
  polling = true;
  pollLoop();
}

async function pollLoop() {
  while (polling) {
    try {
      const r = await fetch(`${API}?room=${encodeURIComponent(roomCode)}&peer=${encodeURIComponent(myId)}`);
      const msgs = await r.json();
      for (const m of msgs) {
        try { await handle(m); } catch (e) { console.error(e); }
      }
    } catch {}
    await new Promise(res => setTimeout(res, 1000));
  }
}

function addLocal(pc) {
  const tracks = localStream.getTracks();
  if (!tracks.some(t => t.kind === 'audio')) pc.addTransceiver('audio', { direction: 'recvonly' });
  if (!tracks.some(t => t.kind === 'video')) pc.addTransceiver('video', { direction: 'recvonly' });
  tracks.forEach(t => pc.addTrack(t, localStream));
}

function makePC(id) {
  if (pcs.has(id)) return pcs.get(id);
  const pc = new RTCPeerConnection(ICE);
  pcs.set(id, pc);
  pc.onicecandidate = e => { if (e.candidate) send(id, 'ice', e.candidate); };
  pc.ontrack = e => addTile(id, e.streams[0] || new MediaStream([e.track]));
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed' || pc.connectionState === 'closed') dropPeer(id);
  };
  return pc;
}

function dropPeer(id) {
  pcs.get(id)?.close();
  pcs.delete(id);
  pending.delete(id);
  members.delete(id);
  removeTile(id);
}

async function callPeer(id) {
  if (pcs.has(id)) return;
  const pc = makePC(id);
  addLocal(pc);
  await pc.setLocalDescription(await pc.createOffer());
  await send(id, 'offer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
}

async function addIce(id, cand) {
  const pc = pcs.get(id);
  if (!pc || !pc.remoteDescription) {
    if (!pending.has(id)) pending.set(id, []);
    pending.get(id).push(cand);
    return;
  }
  await pc.addIceCandidate(cand).catch(() => {});
}

async function flushIce(id) {
  const pc = pcs.get(id);
  for (const c of pending.get(id) || []) await pc.addIceCandidate(c).catch(() => {});
  pending.delete(id);
}

async function handle(m) {
  if (m.type === 'join') {
    if (!isHost) return;
    await send(m.from, 'members', [roomCode, ...members]);
    members.add(m.from);
    return;
  }

  if (m.type === 'members') {
    if (isHost) return;
    clearTimeout(joinTimer);
    if (!roomShown) showRoom();
    for (const id of m.data) if (id !== myId) await callPeer(id);
    return;
  }

  if (m.type === 'offer') {
    const pc = makePC(m.from);
    await pc.setRemoteDescription(m.data);
    await flushIce(m.from);
    addLocal(pc);
    await pc.setLocalDescription(await pc.createAnswer());
    await send(m.from, 'answer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
    return;
  }

  if (m.type === 'answer') {
    const pc = pcs.get(m.from);
    if (!pc) return;
    await pc.setRemoteDescription(m.data);
    await flushIce(m.from);
    return;
  }

  if (m.type === 'ice') return addIce(m.from, m.data);

  if (m.type === 'bye') dropPeer(m.from);
}

async function createRoom() {
  setErr('');
  $('createBtn').disabled = true;
  $('createBtn').textContent = 'Создаю комнату…';
  try {
    await getMedia();
    roomCode = randomCode();
    myId = roomCode;
    isHost = true;
    startPolling();
    showRoom();
  } catch (e) {
    leave();
    setErr(e.message || 'Ошибка');
  }
}

async function joinRoom(code) {
  setErr('');
  try {
    await getMedia();
    roomCode = code;
    myId = randomId();
    isHost = false;
    startPolling();
    await send(code, 'join', null);
    joinTimer = setTimeout(() => {
      leave();
      setErr('Комната не найдена или хост не в сети');
    }, 12000);
  } catch (e) {
    leave();
    setErr(e.message || 'Ошибка');
  }
}

function toggleTrack(kind) {
  const track = kind === 'audio' ? localStream?.getAudioTracks()[0] : localStream?.getVideoTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  setToggle(kind === 'audio' ? 'mic' : 'cam', track.enabled);
}

function leave() {
  if (roomCode) for (const id of pcs.keys()) send(id, 'bye', null);
  polling = false;
  clearTimeout(joinTimer);
  pcs.forEach(pc => pc.close());
  pcs.clear();
  pending.clear();
  members.clear();
  localStream?.getTracks().forEach(t => t.stop());
  localStream = null;
  $('grid').innerHTML = '';
  roomShown = false;
  roomCode = null;
  myId = null;
  isHost = false;
  $('room').classList.add('hidden');
  $('controls').classList.add('hidden');
  $('start').classList.remove('hidden');
  $('createBtn').disabled = false;
  $('createBtn').textContent = 'Создать комнату';
  $('joinGo').disabled = false;
}

window.addEventListener('pagehide', () => {
  if (!roomShown) return;
  for (const id of pcs.keys()) {
    navigator.sendBeacon(API, new Blob([JSON.stringify({ room: roomCode, from: myId, to: id, type: 'bye' })], { type: 'application/json' }));
  }
});

$('createBtn').onclick = createRoom;
$('joinBtn').onclick = () => $('joinBox').classList.toggle('hidden');

function submitJoin() {
  let v = $('codeInput').value.trim();
  if (/^most-/i.test(v)) v = 'Most-' + v.slice(5).toUpperCase();
  if (!CODE_RE.test(v)) { setErr('Код вида Most-xxxxx (10 символов)'); return; }
  joinRoom(v);
}
$('joinGo').onclick = submitJoin;
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitJoin(); });

$('roomCode').onclick = () => {
  navigator.clipboard?.writeText(roomCode);
  $('copyHint').textContent = 'скопировано ✓';
};
$('micBtn').onclick = () => toggleTrack('audio');
$('camBtn').onclick = () => toggleTrack('video');
$('leaveBtn').onclick = leave;
</script>
</body>
</html>
