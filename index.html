<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Most</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f1f3f8;
    --muted: #8b93a7;
    --accent: #7c5cff;
    --accent2: #22d3ee;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 600px at 10% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
      radial-gradient(800px 500px at 110% 110%, rgba(34, 211, 238, 0.18), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .hidden { display: none !important; }

  #start {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: min(400px, 100%);
    padding: 36px 28px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: center;
  }
  .logo {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
  }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 22px;
    border: 1px solid transparent;
    border-radius: 14px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.12s, filter 0.2s, background 0.2s;
    user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #5b8cff); box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: rgba(255, 255, 255, 0.05); border-color: var(--border); }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }

  .devices { display: flex; gap: 10px; }
  .dev {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 10px 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.12s;
  }
  .dev:active { transform: scale(0.97); }
  .dev:hover { background: rgba(255, 255, 255, 0.07); }
  .dev .ico { width: 26px; height: 26px; color: var(--muted); transition: color 0.2s; }
  .dev .ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dev .label { font-size: 13px; font-weight: 600; color: var(--text); }
  .dev .status { font-size: 11px; color: var(--muted); }
  .dev.granted { border-color: rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.08); }
  .dev.granted .ico { color: #86efac; }
  .dev.granted .status { color: #86efac; }
  .dev.denied { border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.07); }
  .dev.denied .ico { color: #fca5a5; }
  .dev.denied .status { color: #fca5a5; }

  .join-box { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  input#codeInput {
    width: 100%;
    padding: 15px;
    font: inherit;
    font-size: 20px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 2px;
    text-align: center;
    color: var(--text);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input#codeInput:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.2); }
  input#codeInput::placeholder { color: #4b5263; letter-spacing: 1px; }

  .err { color: #fca5a5; min-height: 1.2em; font-size: 14px; margin: 0; line-height: 1.4; }

  #room {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 110px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .brand { font-weight: 800; font-size: 22px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .code-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .code-pill:hover { background: rgba(255, 255, 255, 0.08); }
  .code-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .code-pill .hint { color: var(--muted); font-family: system-ui, sans-serif; font-size: 12px; }

  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    align-content: center;
  }
  .tile {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(145deg, #1a1e2a, #0e1118);
    border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
  }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.self video { transform: scaleX(-1); }
  .tile.cam-off video { opacity: 0; }
  .tile .avatar {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #cbd5e1;
    font-size: 15px;
    background: linear-gradient(145deg, #1c2130, #0c0f16);
  }
  .tile.cam-off .avatar { display: flex; }
  .ico-big svg { width: 72px; height: 72px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .tag {
    position: absolute;
    left: 12px;
    bottom: 12px;
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    font-size: 13px;
  }
  .tile:not(.mic-off) .mi { display: none; }
  .mi { display: inline-flex; margin-right: 6px; color: #fca5a5; }
  .mi svg, .ico svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border-radius: 24px;
    background: rgba(18, 21, 30, 0.85);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .round {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.12s;
    padding: 0;
  }
  .round:hover { background: rgba(255, 255, 255, 0.14); }
  .round:active { transform: scale(0.92); }
  .round:disabled { opacity: 0.35; cursor: not-allowed; }
  .round.off { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  .round.leave { background: var(--danger); border-color: transparent; color: #fff; width: 66px; height: 66px; }
  .round.leave:hover { background: #dc2626; }
  .round svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translate(-50%, -20px);
    max-width: min(460px, calc(100% - 32px));
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(30, 20, 24, 0.95);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fecaca;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-line;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .logo { font-size: 38px; }
  }
</style>
</head>
<body>

<section id="start">
  <div class="card">
    <h1 class="logo">Most</h1>
    <p class="sub">Видеозвонки в один клик</p>
    <div class="devices">
      <button id="micPerm" class="dev" type="button">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg></span>
        <span class="label">Микрофон</span>
        <span class="status" id="micStatus">не разрешён</span>
      </button>
      <button id="camPerm" class="dev" type="button">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg></span>
        <span class="label">Видео</span>
        <span class="status" id="camStatus">не разрешено</span>
      </button>
    </div>
    <button id="createBtn" class="btn btn-primary">Создать комнату</button>
    <button id="joinBtn" class="btn btn-ghost">Подключиться</button>
    <div id="joinBox" class="join-box hidden">
      <input id="codeInput" placeholder="Most-xxxxx" maxlength="10" autocomplete="off" spellcheck="false">
      <button id="joinGo" class="btn btn-primary">Войти</button>
    </div>
    <p id="startErr" class="err"></p>
  </div>
</section>

<section id="room" class="hidden">
  <div class="topbar">
    <span class="brand">Most</span>
    <button id="roomCode" class="code-pill" title="Скопировать код">
      <span class="dot"></span>
      <span id="codeText"></span>
      <span class="hint" id="copyHint">копировать</span>
    </button>
  </div>
  <div id="grid"></div>
</section>

<nav id="controls" class="controls hidden">
  <button id="micBtn" class="round" title="Микрофон">
    <svg id="micOn" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
    <svg id="micOff" class="hidden" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M19 11a7 7 0 0 1-.8 3.2M5 11a7 7 0 0 0 10.7 5.9M12 18v3"/></svg>
  </button>
  <button id="camBtn" class="round" title="Камера">
    <svg id="camOn" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
    <svg id="camOff" class="hidden" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M16 10l6-3v10l-6-3M2 8v8a2 2 0 0 0 2 2h9"/><path d="M14.5 6H4"/></svg>
  </button>
  <button id="leaveBtn" class="round leave" title="Выйти">
    <svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
  </button>
</nav>

<div id="toast"></div>

<script>
const API = '/api/signal';
const ICE = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
  ],
};
const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const CODE_RE = /^Most-[A-Z2-9]{5}$/;
const ICON = {
  micOff: '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M19 11a7 7 0 0 1-.8 3.2M5 11a7 7 0 0 0 10.7 5.9M12 18v3"/></svg>',
  camOff: '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/><path d="M3 3l18 18"/></svg>',
};
const $ = id => document.getElementById(id);

let myId = null;
let roomCode = null;
let isHost = false;
let roomShown = false;
let polling = false;
let localStream = null;
let audioTrack = null;
let videoTrack = null;
let joinTimer = null;
let toastTimer = null;
const pcs = new Map();
const pending = new Map();
const members = new Set();
const states = new Map();
const negs = new Map();
const remoteStreams = new Map();

function randomCode() {
  let s = 'Most-';
  for (const b of crypto.getRandomValues(new Uint8Array(5))) s += CHARS[b % CHARS.length];
  return s;
}

function randomId() {
  return 'p-' + crypto.randomUUID().slice(0, 8);
}

function setErr(text) { $('startErr').textContent = text; }

function toast(text, ms = 5000) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

function explainMediaError(e) {
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    return 'Камера и микрофон работают только по https. Открой сайт через https-ссылку.';
  }
  switch (e?.name) {
    case 'NotAllowedError':
    case 'SecurityError':
      return 'Доступ не разрешён. Нажми кнопку ещё раз и выбери «Разрешить». Если запрос не появляется, открой настройки сайта (значок замка у адреса) и разреши микрофон и камеру.';
    case 'NotFoundError':
      return 'Устройство не найдено.';
    case 'NotReadableError':
      return 'Устройство занято другим приложением.';
    default:
      return 'Не удалось получить доступ к устройству.';
  }
}

const BLOCKED_TEXT = 'Браузер заблокировал доступ к устройству. В Chrome: нажми на замок (или значок настроек) слева от адреса → Разрешения → Микрофон и Камера → Разрешить, затем обнови страницу. Если и это не помогло, на телефоне: Настройки → Приложения → Chrome → Разрешения → Микрофон и Камера → Разрешить.';

async function permState(kind) {
  try {
    const r = await navigator.permissions.query({ name: kind === 'mic' ? 'microphone' : 'camera' });
    return r.state;
  } catch {
    return 'unknown';
  }
}

async function deviceError(kind, e) {
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return explainMediaError(e);
  if ((await permState(kind)) === 'denied') return BLOCKED_TEXT;
  return explainMediaError(e);
}

function acquire(kind) {
  return navigator.mediaDevices.getUserMedia(kind === 'audio' ? { audio: true } : { video: true })
    .then(s => kind === 'audio' ? s.getAudioTracks()[0] : s.getVideoTracks()[0]);
}

function setDevBtn(kind, state) {
  // state: true (granted) | false (not requested) | 'denied'
  const b = $(kind + 'Perm');
  const status = $(kind + 'Status');
  b.classList.toggle('granted', state === true);
  b.classList.toggle('denied', state === 'denied');
  status.textContent = state === true
    ? 'разрешено'
    : state === 'denied'
      ? 'заблокировано'
      : (kind === 'mic' ? 'не разрешён' : 'не разрешено');
}

// Каждое устройство запрашивается СВОИМ отдельным getUserMedia-вызовом.
// Важно: не объединять audio+video в один getUserMedia({audio,video}) —
// такой запрос целиком падает, если хотя бы одно устройство недоступно
// или его разрешение отклонено, даже когда второе устройство в порядке.
// Раздельные вызовы дают независимый результат по каждому устройству.
async function requestDevice(kind) {
  const have = kind === 'mic' ? audioTrack : videoTrack;
  if (have) return;
  setErr('Жду ответа браузера…');
  try {
    const t = await acquire(kind === 'mic' ? 'audio' : 'video');
    if (kind === 'mic') audioTrack = t; else videoTrack = t;
    setDevBtn(kind, true);
    setErr('');
    if (roomShown) {
      localStream.addTrack(t);
      for (const pc of pcs.values()) {
        const tr = pc.getTransceivers().find(tt => tt.receiver.track?.kind === t.kind && !tt.sender.track);
        if (tr) { await tr.sender.replaceTrack(t); tr.direction = 'sendrecv'; }
        else pc.addTrack(t, localStream);
      }
      syncControls();
      broadcastState();
    }
  } catch (e) {
    const denied = (await permState(kind)) === 'denied';
    setDevBtn(kind, denied ? 'denied' : false);
    setErr(await deviceError(kind, e));
  }
}

// По умолчанию в руме запрашивается ТОЛЬКО микрофон. Камера остаётся
// выключенной (видеотрек не берётся) — включить её можно вручную кнопкой
// камеры в руме или карточкой «Видео» на старте.
async function getMedia() {
  const problems = [];
  if (!audioTrack) {
    try { audioTrack = await acquire('audio'); } catch (e) { problems.push('Микрофон: ' + await deviceError('mic', e)); }
  }
  setDevBtn('mic', audioTrack ? true : ((await permState('mic')) === 'denied' ? 'denied' : false));
  setDevBtn('cam', videoTrack ? true : ((await permState('cam')) === 'denied' ? 'denied' : false));
  localStream = new MediaStream([audioTrack, videoTrack].filter(Boolean));
  if (problems.length) toast(problems.join('\n\n'), 12000);
  syncControls();
}

function myState() {
  return {
    mic: !!localStream?.getAudioTracks()[0]?.enabled,
    cam: !!localStream?.getVideoTracks()[0]?.enabled,
  };
}

function broadcastState() {
  for (const id of pcs.keys()) send(id, 'state', myState());
}

function syncControls() {
  const a = localStream?.getAudioTracks()[0];
  const v = localStream?.getVideoTracks()[0];
  setToggle('mic', !!a?.enabled);
  setToggle('cam', !!v?.enabled);
  refreshTile('self');
}

function setToggle(kind, on) {
  const btn = $(kind + 'Btn');
  btn.classList.toggle('off', !on);
  $(kind + 'On').classList.toggle('hidden', !on);
  $(kind + 'Off').classList.toggle('hidden', on);
  btn.title = (kind === 'mic' ? 'Микрофон' : 'Камера') + (on ? ': вкл' : ': выкл');
}

function refreshTile(id) {
  const tile = $('tile-' + id);
  if (!tile) return;
  const v = tile.querySelector('video');
  const st = id === 'self' ? myState() : (states.get(id) || { mic: true, cam: true });
  const hasVideo = !!v.srcObject?.getVideoTracks().length;
  tile.classList.toggle('cam-off', !hasVideo || !st.cam);
  tile.classList.toggle('mic-off', !st.mic);
}

function addTile(id, stream, self = false) {
  if ($('tile-' + id)) return;
  const tile = document.createElement('div');
  tile.id = 'tile-' + id;
  tile.className = 'tile' + (self ? ' self' : '');
  const v = document.createElement('video');
  v.autoplay = true;
  v.playsInline = true;
  v.srcObject = stream;
  if (self) v.muted = true;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.innerHTML = `<div class="ico-big">${ICON.camOff}</div><span>Камера выключена</span>`;
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.innerHTML = `<span class="mi">${ICON.micOff}</span>${self ? 'Ты' : 'Участник'}`;
  tile.append(v, avatar, tag);
  $('grid').appendChild(tile);
  if (!self) {
    stream.addEventListener?.('addtrack', () => refreshTile(id));
    stream.addEventListener?.('removetrack', () => refreshTile(id));
  }
  refreshTile(id);
}

function removeTile(id) {
  $('tile-' + id)?.remove();
  states.delete(id);
}

function showRoom() {
  roomShown = true;
  $('codeText').textContent = roomCode;
  $('copyHint').textContent = 'копировать';
  $('start').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('controls').classList.remove('hidden');
  addTile('self', localStream, true);
  syncControls();
}

async function send(to, type, data) {
  try {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: roomCode, from: myId, to, type, data }),
    });
  } catch {}
}

function startPolling() {
  polling = true;
  pollLoop();
}

async function pollLoop() {
  while (polling) {
    try {
      const r = await fetch(`${API}?room=${encodeURIComponent(roomCode)}&peer=${encodeURIComponent(myId)}`);
      const msgs = await r.json();
      for (const m of msgs) {
        try { await handle(m); } catch (e) { console.error(e); }
      }
    } catch {}
    await new Promise(res => setTimeout(res, 1000));
  }
}

function addLocal(pc) {
  const tracks = localStream.getTracks();
  if (!tracks.some(t => t.kind === 'audio')) pc.addTransceiver('audio', { direction: 'recvonly' });
  if (!tracks.some(t => t.kind === 'video')) pc.addTransceiver('video', { direction: 'recvonly' });
  tracks.forEach(t => pc.addTrack(t, localStream));
}

function makePC(id) {
  if (pcs.has(id)) return pcs.get(id);
  const pc = new RTCPeerConnection(ICE);
  pcs.set(id, pc);
  const n = { making: false, ignore: false, polite: myId < id };
  negs.set(id, n);
  pc.onicecandidate = e => { if (e.candidate) send(id, 'ice', e.candidate); };
  pc.onnegotiationneeded = async () => {
    try {
      n.making = true;
      await pc.setLocalDescription();
      await send(id, 'offer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
    } catch (e) {
      console.error(e);
    } finally {
      n.making = false;
    }
  };
  pc.ontrack = e => {
    let s = remoteStreams.get(id);
    if (!s) {
      s = new MediaStream();
      remoteStreams.set(id, s);
    }
    s.addTrack(e.track);
    addTile(id, s);
    e.track.onunmute = () => refreshTile(id);
    refreshTile(id);
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') send(id, 'state', myState());
    if (pc.connectionState === 'failed' || pc.connectionState === 'closed') dropPeer(id);
  };
  return pc;
}

function dropPeer(id) {
  pcs.get(id)?.close();
  pcs.delete(id);
  pending.delete(id);
  members.delete(id);
  negs.delete(id);
  remoteStreams.delete(id);
  removeTile(id);
}

async function callPeer(id) {
  if (pcs.has(id)) return;
  addLocal(makePC(id));
}

async function addIce(id, cand) {
  const pc = pcs.get(id);
  if (!pc || !pc.remoteDescription) {
    if (!pending.has(id)) pending.set(id, []);
    pending.get(id).push(cand);
    return;
  }
  await pc.addIceCandidate(cand).catch(() => {});
}

async function flushIce(id) {
  const pc = pcs.get(id);
  for (const c of pending.get(id) || []) await pc.addIceCandidate(c).catch(() => {});
  pending.delete(id);
}

async function handle(m) {
  if (m.type === 'join') {
    if (!isHost) return;
    await send(m.from, 'members', [roomCode, ...members]);
    members.add(m.from);
    return;
  }

  if (m.type === 'members') {
    if (isHost) return;
    clearTimeout(joinTimer);
    if (!roomShown) showRoom();
    for (const id of m.data) if (id !== myId) await callPeer(id);
    return;
  }

  if (m.type === 'offer') {
    const fresh = !pcs.has(m.from);
    const pc = makePC(m.from);
    const n = negs.get(m.from);
    n.ignore = !n.polite && (n.making || pc.signalingState !== 'stable');
    if (n.ignore) return;
    await pc.setRemoteDescription(m.data);
    await flushIce(m.from);
    if (fresh) addLocal(pc);
    await pc.setLocalDescription(await pc.createAnswer());
    await send(m.from, 'answer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
    return;
  }

  if (m.type === 'answer') {
    const pc = pcs.get(m.from);
    if (!pc || pc.signalingState !== 'have-local-offer') return;
    await pc.setRemoteDescription(m.data);
    await flushIce(m.from);
    return;
  }

  if (m.type === 'ice') return addIce(m.from, m.data);

  if (m.type === 'state') {
    states.set(m.from, m.data);
    refreshTile(m.from);
    return;
  }

  if (m.type === 'bye') dropPeer(m.from);
}

async function createRoom() {
  setErr('');
  $('createBtn').disabled = true;
  $('createBtn').textContent = 'Создаю комнату…';
  try {
    await getMedia();
    roomCode = randomCode();
    myId = roomCode;
    isHost = true;
    startPolling();
    showRoom();
  } catch (e) {
    leave();
    setErr(e.message || 'Ошибка');
  }
}

async function joinRoom(code) {
  setErr('');
  try {
    await getMedia();
    roomCode = code;
    myId = randomId();
    isHost = false;
    startPolling();
    await send(code, 'join', null);
    joinTimer = setTimeout(() => {
      leave();
      setErr('Комната не найдена или хост не в сети');
    }, 12000);
  } catch (e) {
    leave();
    setErr(e.message || 'Ошибка');
  }
}

async function toggleTrack(kind) {
  const track = kind === 'audio' ? audioTrack : videoTrack;
  if (!track) {
    await enableDevice(kind);
    return;
  }
  track.enabled = !track.enabled;
  syncControls();
  broadcastState();
}

async function enableDevice(kind) {
  let track;
  try {
    track = await acquire(kind);
  } catch (e) {
    toast(await deviceError(kind === 'audio' ? 'mic' : 'cam', e), 9000);
    return;
  }
  if (kind === 'audio') audioTrack = track; else videoTrack = track;
  localStream.addTrack(track);
  for (const pc of pcs.values()) {
    const tr = pc.getTransceivers().find(t => t.receiver.track.kind === track.kind && !t.sender.track);
    if (tr) {
      await tr.sender.replaceTrack(track);
      tr.direction = 'sendrecv';
    } else {
      pc.addTrack(track, localStream);
    }
  }
  syncControls();
  broadcastState();
}

function leave() {
  if (roomCode) for (const id of pcs.keys()) send(id, 'bye', null);
  polling = false;
  clearTimeout(joinTimer);
  pcs.forEach(pc => pc.close());
  pcs.clear();
  pending.clear();
  members.clear();
  states.clear();
  negs.clear();
  remoteStreams.clear();
  audioTrack?.stop();
  videoTrack?.stop();
  audioTrack = null;
  videoTrack = null;
  localStream = null;
  $('grid').innerHTML = '';
  roomShown = false;
  roomCode = null;
  myId = null;
  isHost = false;
  $('room').classList.add('hidden');
  $('controls').classList.add('hidden');
  $('start').classList.remove('hidden');
  $('createBtn').disabled = false;
  $('createBtn').textContent = 'Создать комнату';
  $('joinGo').disabled = false;
  setDevBtn('mic', false);
  setDevBtn('cam', false);
}

window.addEventListener('pagehide', () => {
  if (!roomShown) return;
  for (const id of pcs.keys()) {
    navigator.sendBeacon(API, new Blob([JSON.stringify({ room: roomCode, from: myId, to: id, type: 'bye' })], { type: 'application/json' }));
  }
});

$('micPerm').onclick = () => requestDevice('mic');
$('camPerm').onclick = () => requestDevice('cam');

// Показываем реальный статус разрешения сразу при загрузке страницы,
// не дожидаясь клика. Если браузер уже когда-то блокировал доступ,
// getUserMedia больше не покажет диалог сам — это нормальное поведение
// браузера, а не баг приложения, и это важно увидеть сразу, а не гадать.
(async () => {
  if (!navigator.permissions?.query) return;
  const mic = await permState('mic');
  const cam = await permState('cam');
  if (mic === 'denied') setDevBtn('mic', 'denied');
  if (cam === 'denied') setDevBtn('cam', 'denied');
  if (mic === 'denied' || cam === 'denied') {
    setErr('Доступ заблокирован браузером. Нажми на замок рядом с адресом сайта → разреши микрофон/камеру → обнови страницу.');
  }
})();
$('createBtn').onclick = createRoom;
$('joinBtn').onclick = () => $('joinBox').classList.toggle('hidden');

function submitJoin() {
  let v = $('codeInput').value.trim();
  if (/^most-/i.test(v)) v = 'Most-' + v.slice(5).toUpperCase();
  if (!CODE_RE.test(v)) { setErr('Код вида Most-xxxxx (10 символов)'); return; }
  joinRoom(v);
}
$('joinGo').onclick = submitJoin;
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitJoin(); });

$('roomCode').onclick = () => {
  navigator.clipboard?.writeText(roomCode);
  $('copyHint').textContent = 'скопировано ✓';
};
$('micBtn').onclick = () => toggleTrack('audio');
$('camBtn').onclick = () => toggleTrack('video');
$('leaveBtn').onclick = leave;
</script>
</body>
</html>
