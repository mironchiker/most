[build]
  publish = "."
  functions = "netlify/functions"

# НЕ добавлять сюда редирект /api/* -> /.netlify/functions/:splat.
# Функция signal.mjs уже сама объявляет export const config = { path: "/api/signal" } —
# это нативный способ Netlify Functions v2 давать кастомный URL. При этом
# функция НЕ доступна по старому адресу /.netlify/functions/signal.
# Redirect с force=true перехватывает /api/signal раньше, чем он доходит
# до нативного роута, и уводит его на несуществующий путь — 404.
